<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Přihlášení</title>
    <style>
        body { background-color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background-color: #6c757d; border-radius: 10px; padding: 40px; width: 450px; color: white; }
        .btn-warning { background-color: #ffc107; border: none; font-weight: bold; padding: 12px; }
        .form-control { margin-bottom: 20px; padding: 10px; }
        .text-warning { color: #ffc107 !important; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg text-center">
        <h1 class="text-warning mb-5">Přihlášení</h1>
        <form method="post">
            {% csrf_token %}
            <div class="text-start mb-1"><small>Jméno</small></div>
            <input type="text" name="username" class="form-control" required>
            <div class="text-start mb-1"><small>Heslo</small></div>
            <input type="password" name="password" class="form-control" required>
            
            <button type="submit" class="btn btn-warning w-100 mt-3">Vstoupit do portfolia</button>
        </form>
        <div class="mt-4">
            <small class="text-light">Nemáš účet? <a href="{% url 'register' %}" class="text-warning text-decoration-none fw-bold">Zaregistruj se</a></small>
        </div>
    </div>
</body>
</html>
