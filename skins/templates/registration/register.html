<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registrace</title>
    <style>
        body { background-color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { background-color: #343a40; border-radius: 10px; padding: 40px; width: 450px; color: white; border: 1px solid #ffc107; }
        .btn-warning { background-color: #ffc107; border: none; font-weight: bold; }
        .text-warning { color: #ffc107 !important; }
        form p { text-align: left; font-size: 0.9rem; margin-bottom: 15px; }
        input { width: 100%; padding: 8px; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <div class="register-card text-center">
        <h2 class="text-warning mb-4">Nová registrace</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning w-100 mt-3">Vytvořit účet</button>
        </form>
        <div class="mt-3">
            <small><a href="{% url 'login' %}" class="text-warning text-decoration-none">Zpět na přihlášení</a></small>
        </div>
    </div>
</body>
</html>
