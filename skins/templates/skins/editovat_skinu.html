<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Upravit skin</title>
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <div class="card bg-secondary p-5 shadow">
            <h2>Upravit skin: {{ skin.name }}</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Uložit změny</button>
                <a href="{% url 'prehled_skinu' %}" class="btn btn-outline-light">Zpět</a>
            </form>
        </div>
    </div>
</body>
</html>
